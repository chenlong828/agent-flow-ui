<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill 库 · AgentFlow</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
/* ---- Skill 库私有样式（sk- 前缀） ---- */
.sk-layout { display:flex; gap:16px; align-items:flex-start; }
.sk-side { width:200px; flex-shrink:0; padding:12px 10px; }
.sk-side-h { font-size:11px; font-weight:700; color:var(--t-3); letter-spacing:1px; margin:2px 6px 6px; }
.sk-cats { margin-bottom:14px; }
.sk-cat { display:flex; justify-content:space-between; align-items:center; padding:5px 8px; border-radius:6px; font-size:13px; color:var(--t-2); cursor:pointer; }
.sk-cat:hover { background:var(--c-bg); color:var(--t-1); }
.sk-cat.on { background:var(--c-primary-bg); color:var(--c-primary); font-weight:600; }
.sk-n { font-size:11px; color:var(--t-3); }
.sk-cat.on .sk-n { color:var(--c-primary); }
.sk-tagcloud .chip, .sk-tagcloud .tag { cursor:pointer; }
.sk-main { flex:1; min-width:0; }
.sk-uref { color:var(--c-primary); font-weight:600; text-decoration:none; cursor:pointer; }
.sk-uref:hover { text-decoration:underline; }
.sk-lbl { font-size:12px; color:var(--t-2); font-weight:600; margin:12px 0 5px; }
.sk-kv { display:flex; gap:8px; font-size:13px; margin:6px 0; line-height:1.6; }
.sk-k { color:var(--t-3); flex-shrink:0; }
.sk-ptext { font-size:13px; line-height:1.7; }
.sk-pre { font-size:13px; line-height:1.8; white-space:pre-wrap; color:var(--t-1); background:var(--c-bg); border-radius:6px; padding:10px 12px; }
.sk-sec { padding:8px 2px 4px; }
.sk-load { font-size:10px; color:var(--t-3); background:#eef1f5; border-radius:3px; padding:0 5px; margin-left:6px; font-weight:400; }
.sk-x { cursor:pointer; font-style:normal; opacity:.55; font-size:14px; line-height:1; }
.sk-x:hover { opacity:1; color:var(--c-fail); }
.sk-chipin { margin-top:8px; }
.sk-ref { display:flex; align-items:flex-start; gap:10px; padding:6px 0; border-bottom:1px dashed var(--c-line); font-size:13px; }
.sk-ref:last-child { border-bottom:none; }
.sk-refpath { color:var(--t-2); word-break:break-all; }
.sk-av { width:26px; height:26px; border-radius:50%; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
.sk-docbar { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-bottom:10px; border-bottom:1px solid var(--c-line); margin-bottom:10px; }
.sk-docmeta { font-size:11px; color:var(--t-3); margin-bottom:6px; }
.sk-doc { margin:0; padding:14px; background:var(--c-bg); border-radius:6px; font:12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre-wrap; word-break:break-word; color:var(--t-1); }
.d-body .sub { font-size:11px; color:var(--t-3); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="../assets/js/pages/skills.js"></script>
</body>
</html>
