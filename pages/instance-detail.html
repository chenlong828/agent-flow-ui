<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实例详情 · AgentFlow</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
.id-layout{display:flex;gap:12px;align-items:stretch;}
.id-trace{flex:1;min-width:0;display:flex;flex-direction:column;}
.id-trace .cv-wrap{flex:1;min-height:430px;}
.id-panel{width:410px;flex-shrink:0;display:flex;flex-direction:column;gap:0;}
.id-tabs{display:flex;border-bottom:1px solid var(--c-line);background:var(--c-panel);border-radius:8px 8px 0 0;border:1px solid var(--c-line);border-bottom:none;padding:0 6px;}
.id-tabs .tab{padding:9px 12px;font-size:12px;cursor:pointer;color:var(--t-2);border-bottom:2px solid transparent;margin-bottom:-1px;}
.id-tabs .tab.active{color:var(--c-primary);border-bottom-color:var(--c-primary);font-weight:600;}
.id-body{flex:1;overflow-y:auto;border:1px solid var(--c-line);border-radius:0 0 8px 8px;background:var(--c-panel);padding:14px 16px;max-height:calc(100vh - 250px);}
.id-node-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.id-node-h b{font-size:15px;}
.id-confirm-card{border:1px solid #fdba74;background:#fff7ed;border-radius:8px;padding:14px;margin-bottom:12px;}
.id-confirm-card h4{font-size:14px;margin-bottom:8px;}
.md h4{margin:8px 0 4px;font-size:13px;}
.md ul{margin:4px 0 8px 18px;}
.md p{margin:4px 0;}
.id-sub{font-size:12px;color:var(--t-2);}
.id-fan-cards{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.id-fan-cards .fc{flex:1;min-width:64px;border:1px solid var(--c-line);border-radius:6px;padding:6px 10px;text-align:center;}
.id-fan-cards .fc .n{font-size:16px;font-weight:700;}
.id-fan-cards .fc .l{font-size:11px;color:var(--t-3);}
.st-pending,.st-skip{opacity:.55;}
.st-paused{opacity:.8;}
</style>
</head>
<body>
<div id="app"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/pages/instance-detail.js"></script>
</body>
</html>
