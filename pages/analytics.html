<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>效能看板 · AgentFlow</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
/* ===== 效能看板私有样式（an- 前缀） ===== */
.an-grid-21 { grid-template-columns: 2fr 1fr; }
.an-stat-flex { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.an-muted { color: var(--t-3); }
.an-legend { display: inline-flex; align-items: center; gap: 14px; margin-left: 12px; font-size: 11px; color: var(--t-3); }
.an-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.an-stage-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.an-stage-row + .an-stage-row { border-top: 1px dashed var(--c-line); }
.an-stage-name { flex: none; width: 60px; font-size: 12px; color: var(--t-3); }
.an-stage-row .progress { flex: 1; }
.an-stage-val { flex: none; width: 42px; text-align: right; font-size: 12px; font-weight: 600; }
.an-pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 10px; font-size: 12px; }
.an-audit-item { padding: 10px 2px; }
.an-audit-item + .an-audit-item { border-top: 1px solid var(--c-line); }
.an-audit-top { display: flex; align-items: center; gap: 8px; }
.an-skill-name { font-size: 13px; font-weight: 600; }
.an-audit-advice { font-size: 11px; color: var(--t-3); margin-top: 4px; }
.an-inst-link { color: var(--t-1); font-weight: 600; cursor: pointer; }
.an-inst-link:hover { color: var(--c-primary); }
.an-link { flex: none; font-size: 12px; color: var(--c-primary); text-decoration: none; }
.an-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/pages/analytics.js"></script>
</body>
</html>
