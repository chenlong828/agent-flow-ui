<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人 Key 管理 · AgentFlow</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
  /* ---- 个人 Key 页面私有样式（前缀 ky-） ---- */
  .ky-radio { display:flex; align-items:center; gap:8px; border:1px solid var(--c-line-2); border-radius:6px; padding:9px 12px; cursor:pointer; margin-bottom:8px; font-size:13px; }
  .ky-radio input { margin:0; }
  .ky-radio.on { border-color:var(--c-primary); background:#eff6ff; }
  .ky-radio .sub { margin-left:auto; }
  .ky-type-form { border-top:1px dashed var(--c-line); padding-top:12px; margin-top:4px; }
  .ky-gen { font-size:11px; color:var(--t-3); margin-top:6px; }
  .ky-hint-err { color:#b91c1c !important; font-weight:600; }
  .ky-checklist { max-height:220px; overflow:auto; border:1px solid var(--c-line-2); border-radius:6px; }
  .ky-check { display:flex; gap:8px; align-items:center; padding:7px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--c-line); margin:0; }
  .ky-check:last-child { border-bottom:none; }
  .ky-check:hover { background:#f6f8fb; }
  .ky-check input { margin:0; }
  .ky-no-bind { color:var(--t-3); font-size:12px; }
  .ky-acts { display:flex; gap:6px; align-items:center; white-space:nowrap; }
  .ky-ro { background:#f1f5f9; color:var(--t-2); cursor:default; }
  .ky-sub-warn { font-size:11px; color:#b45309; margin-top:2px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/pages/keys.js"></script>
</body>
</html>
