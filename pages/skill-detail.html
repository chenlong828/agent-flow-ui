<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill 详情 · AgentFlow</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
/* ---- Skill 专门页私有样式（skd- / sk-md- 前缀） ---- */
.skd-layout { display:flex; flex-direction:column; gap:14px; }
.skd-card { background:var(--c-panel); border:1px solid var(--c-line); border-radius:8px; padding:16px 18px; }
.skd-kv { display:flex; gap:10px; font-size:13px; line-height:1.7; margin:6px 0; }
.skd-k { color:var(--t-3); flex-shrink:0; width:64px; }
.skd-sec { padding:6px 2px 10px; }
.skd-pre { font-size:13px; line-height:1.8; white-space:pre-wrap; color:var(--t-1); background:var(--c-bg); border-radius:6px; padding:10px 12px; }
.skd-x { cursor:pointer; font-style:normal; opacity:.55; font-size:14px; line-height:1; }
.skd-x:hover { opacity:1; color:var(--c-fail); }
.skd-chipin { margin-top:8px; }
.skd-ref { display:flex; align-items:flex-start; gap:10px; padding:6px 0; border-bottom:1px dashed var(--c-line); font-size:13px; }
.skd-ref:last-child { border-bottom:none; }
.skd-refpath { color:var(--t-2); word-break:break-all; }
.skd-docbar { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
.skd-docmeta { font-size:11px; color:var(--t-3); margin-bottom:6px; }
.skd-docroot { min-height:120px; }
.skd-empty { padding:28px 0; text-align:center; color:var(--t-2); font-size:13px; }

/* Milkdown 渲染容器：只读 + 语法高亮 */
.sk-md-meta { background:var(--c-bg); border-radius:6px; padding:10px 12px; margin-bottom:12px; }
.sk-md-meta-row { display:flex; gap:10px; font-size:12px; line-height:1.7; }
.sk-md-meta-k { color:var(--t-3); flex-shrink:0; width:56px; }
.sk-md-meta-v { color:var(--t-1); word-break:break-word; }
.sk-md-body { color:var(--t-1); font-size:14px; line-height:1.8; }
.sk-md-body h1, .sk-md-body h2, .sk-md-body h3, .sk-md-body h4 { font-weight:700; line-height:1.4; margin:18px 0 10px; }
.sk-md-body h1 { font-size:20px; }
.sk-md-body h2 { font-size:17px; }
.sk-md-body h3 { font-size:15px; }
.sk-md-body h4 { font-size:14px; }
.sk-md-body p { margin:8px 0; }
.sk-md-body ul, .sk-md-body ol { margin:8px 0 8px 20px; }
.sk-md-body li { margin:4px 0; }
.sk-md-body blockquote { margin:10px 0; padding:8px 12px; border-left:3px solid var(--c-line); background:var(--c-bg); color:var(--t-2); }
.sk-md-body code { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; background:var(--c-bg); border-radius:4px; padding:1px 4px; }
.sk-md-body pre { margin:10px 0; padding:12px 14px; background:#111827; color:#e5e7eb; border-radius:6px; overflow:auto; }
.sk-md-body pre code { background:none; padding:0; color:inherit; font-size:12.5px; line-height:1.7; }
.sk-md-body table { border-collapse:collapse; margin:10px 0; font-size:13px; }
.sk-md-body th, .sk-md-body td { border:1px solid var(--c-line); padding:6px 10px; }
.sk-md-body img { max-width:100%; }
.sk-md-body hr { border:none; border-top:1px solid var(--c-line); margin:14px 0; }
.sk-md-body a { color:var(--c-primary); text-decoration:none; }
.sk-md-body a:hover { text-decoration:underline; }
.sk-md-body .token.comment, .sk-md-body .token.prolog, .sk-md-body .token.doctype, .sk-md-body .token.cdata { color:#6b7280; }
.sk-md-body .token.punctuation { color:#9ca3af; }
.sk-md-body .token.property, .sk-md-body .token.tag, .sk-md-body .token.constant, .sk-md-body .token.symbol, .sk-md-body .token.deleted { color:#f472b6; }
.sk-md-body .token.boolean, .sk-md-body .token.number { color:#fbbf24; }
.sk-md-body .token.selector, .sk-md-body .token.attr-name, .sk-md-body .token.string, .sk-md-body .token.char, .sk-md-body .token.builtin, .sk-md-body .token.inserted { color:#34d399; }
.sk-md-body .token.operator, .sk-md-body .token.entity, .sk-md-body .token.url { color:#93c5fd; }
.sk-md-body .token.atrule, .sk-md-body .token.attr-value, .sk-md-body .token.keyword { color:#60a5fa; }
.sk-md-body .token.function, .sk-md-body .token.class-name { color:#a78bfa; }
.sk-md-body .token.regex, .sk-md-body .token.important, .sk-md-body .token.variable { color:#fca5a5; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/pages/skill-common.js"></script>
<script src="../assets/js/pages/skill-detail-markdown.js"></script>
<script src="../assets/js/pages/skill-detail.js"></script>
</body>
</html>
