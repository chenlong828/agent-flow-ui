<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作流编辑器 · AgentFlow</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
.we-layout{display:flex;gap:12px;align-items:stretch;}
.we-palette{width:176px;flex-shrink:0;}
.we-palette .pg{font-size:11px;color:var(--t-3);margin:12px 4px 4px;font-weight:600;}
.we-pitem{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px dashed var(--c-line-2);border-radius:6px;background:var(--c-panel);margin-bottom:6px;cursor:grab;font-size:12px;color:var(--t-2);}
.we-pitem:hover{border-color:var(--c-primary);color:var(--c-primary);}
.we-canvas-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.we-canvas-col .cv-wrap{flex:1;min-height:430px;}
.we-name{width:170px;flex:0 0 170px;font-weight:700;}
.we-segwrap{display:flex;align-items:center;gap:8px;}
.edge-del{position:absolute;z-index:6;background:#fff;border:1px solid var(--c-fail);color:var(--c-fail);border-radius:6px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);}
svg.cv-edges path.hit{pointer-events:stroke;stroke:transparent;stroke-width:16;cursor:pointer;}
svg.cv-edges path.esel{stroke:var(--c-fail)!important;stroke-width:2.6!important;}
.stage-sel{border-color:var(--c-primary)!important;}
.insp-sec{border:1px solid var(--c-line);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:var(--c-panel);}
.insp-sec .t{font-size:12px;font-weight:700;color:var(--t-2);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.chip-add{display:flex;gap:6px;margin-top:6px;}
.chip-add input{flex:1;}
.page-header .acts { flex-wrap:wrap; justify-content:flex-end; }
.page-header .acts .btn { white-space:nowrap; flex-shrink:0; }
.we-rev { font-size:11px; color:var(--t-3); white-space:nowrap; }
.we-rev.dirty { color:var(--c-wait); font-weight:600; }
.we-issues { padding:8px 12px; margin-top:8px; max-height:150px; overflow:auto; font-size:12px; }
.we-ok { display:flex; align-items:center; gap:6px; color:var(--c-ok); }
.we-issue { padding:4px 0; border-bottom:1px dashed var(--c-line); cursor:pointer; }
.we-issue:last-child { border-bottom:none; }
.we-issue b { margin-right:6px; }
.we-issue.err b { color:var(--c-fail); }
.we-issue.warn b { color:var(--c-wait); }
.we-issue .mono { color:var(--t-3); font-size:10px; }
.cv-node.has-error, .cv-stage.has-error { border-color:var(--c-fail)!important; box-shadow:0 0 0 2px rgba(220,38,38,.16); }
svg.cv-edges path.has-error { stroke:var(--c-fail)!important; stroke-width:2.6!important; }
.we-dsl { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.we-dsl .code-block { flex:1; overflow:auto; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="../assets/js/pages/workflow-editor.js"></script>
</body>
</html>
