<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>运行实例 · AgentFlow</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
.in-list .tbl td{vertical-align:middle;}
.in-prog{display:flex;align-items:center;gap:8px;min-width:150px;}
.in-prog .progress{flex:1;}
.in-new-row{margin-top:6px;}
/* 发起运行弹窗：所见即所得意图编辑（Milkdown） */
.rn-editor{border:1px solid var(--c-line);border-radius:6px;height:240px;overflow:auto;padding:10px 12px;background:var(--c-panel);}
.rn-editor .ProseMirror{outline:none;font-size:13px;line-height:1.75;overflow-wrap:anywhere;}
.rn-editor .ProseMirror>*{max-width:100%;}
.rn-editor .ProseMirror h1,.rn-editor .ProseMirror h2,.rn-editor .ProseMirror h3{font-size:15px;margin:8px 0 4px;}
.rn-editor .ProseMirror p{margin:4px 0;}
.rn-editor .ProseMirror ul,.rn-editor .ProseMirror ol{margin:4px 0 4px 20px;}
.rn-editor .ProseMirror:empty:before{content:attr(data-placeholder);color:var(--t-3);}
.rn-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t-2);margin-top:4px;}
/* 初始资料（图片）：本地暂存，点「发起运行」时才上传 */
.rn-inputs{display:flex;align-items:center;gap:8px;min-height:76px;border:1px dashed var(--c-line-2);border-radius:8px;padding:6px 8px;background:var(--c-panel);transition:border-color .15s,background .15s;}
.rn-inputs.rn-drag{border-color:var(--c-primary);background:var(--c-primary-bg);}
.rn-inputs-strip{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px 0;flex:1;min-width:0;scrollbar-width:none;}
.rn-inputs-strip::-webkit-scrollbar{display:none;}
.rn-thumb{position:relative;width:64px;height:64px;flex:0 0 auto;border-radius:6px;overflow:hidden;border:1px solid var(--c-line-2);background:var(--c-bg);}
.rn-thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
.rn-thumb-del{position:absolute;top:2px;right:2px;width:16px;height:16px;border:none;border-radius:50%;background:rgba(17,24,39,.72);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;opacity:0;transition:opacity .12s;}
.rn-thumb:hover .rn-thumb-del,.rn-thumb:focus-within .rn-thumb-del{opacity:1;}
@media (hover:none){.rn-thumb-del{opacity:1;}}
.rn-thumb-del:disabled{opacity:.35;cursor:not-allowed;}
.rn-thumb-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(17,24,39,.35);}
.rn-thumb-bar i{display:block;height:100%;background:var(--c-primary);}
.rn-thumb-ok{position:absolute;left:2px;bottom:2px;width:14px;height:14px;border-radius:50%;background:var(--c-ok);color:#fff;display:flex;align-items:center;justify-content:center;}
.rn-inputs-add{flex:0 0 auto;height:30px;padding:0 10px;font-size:12px;border:1px solid var(--c-line-2);border-radius:6px;background:var(--c-panel);color:var(--t-2);cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.rn-inputs-add:hover:not(:disabled){border-color:var(--c-primary);color:var(--c-primary);}
.rn-inputs-add:disabled{opacity:.5;cursor:not-allowed;}
.rn-inputs-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.rn-inputs-meta{font-size:11px;color:var(--t-3);white-space:nowrap;}
.rn-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="../assets/js/pages/instances.js"></script>
</body>
</html>
