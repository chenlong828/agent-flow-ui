<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作区配置 · AgentFlow</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
  .ws-toolbar select.inp { width:132px; }
  .ws-count { font-size:12px; color:var(--t-3); }
  .ws-cred { white-space:nowrap; }
  .ws-op { white-space:nowrap; }
  .ws-dis { color:var(--t-3); cursor:not-allowed; padding:2px 6px; font-size:12px; user-select:none; }
  .ws-err { color:var(--c-fail); font-size:11px; margin-top:3px; }
  .ws-inp-err { border-color:var(--c-fail) !important; }
  .ws-step-desc { font-size:12px; color:var(--t-3); margin-bottom:14px; }
  .ws-radio-row { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--c-line); border-radius:6px; cursor:pointer; }
  .ws-radio-row.on { border-color:var(--c-primary); background:var(--c-primary-bg); }
  .ws-radio-row input { margin-top:3px; }
  .ws-tree-box { border:1px solid var(--c-line); border-radius:6px; background:#fafbfd; padding:10px 14px; margin-top:12px; }
  .ws-test-tip { font-size:12px; color:var(--t-3); }
</style>
</head>
<body>
<div id="app"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/pages/workspace-common.js"></script>
<script src="../assets/js/pages/workspaces.js"></script>
</body>
</html>
